<div>
  <h1 class="text-center text-warning" style="font-size: xxx-large;">{{titulo}}</h1>
</div>

<app-producto (enviarProducto)="recibirProducto($event)"/>

<table class="table table-dark table-striped mt-4">
    <thead>
        <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Descripción</th>
            <th scope="col">Precio</th>
        </tr>
        <tr>
            <td>
                {{miProducto.nombre}}
            </td>
            <td>
                {{miProducto.descripcion}}
            </td>
            <td>
                {{miProducto.precio}}
            </td>
        </tr>
    </thead>
</table>
